<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 900"
  fill="none"
  role="img"
  aria-label="+J Jakarta icon"
>
  <!-- Kepulauan Seribu — top-left triangle -->
  <polygon points="0,0 100,0 0,100" fill="currentColor" />

  <!-- Utara (North) -->
  <rect x="200" y="0" width="100" height="100" fill="currentColor" />

  <!-- Barat (West) -->
  <rect x="0" y="200" width="100" height="100" fill="currentColor" />

  <!-- Pusat (Centre) -->
  <rect x="200" y="200" width="100" height="100" fill="currentColor" />

  <!-- Timur (East) -->
  <rect x="400" y="200" width="100" height="100" fill="currentColor" />

  <!-- Selatan (South) -->
  <rect x="200" y="400" width="100" height="100" fill="currentColor" />

  <!-- J letterform -->
  <path
    d="M 400,400 L 500,400 L 500,650 C 500,805 410,900 270,900 L 250,900 L 250,800 L 270,800 C 355,800 400,750 400,650 Z"
    fill="currentColor"
  />
</svg>
